name: Build and Push to Docker Hub

on:
  push:
    branches:
      - master  # Cambia a main si tu rama principal se llama así

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4  # Actualizado a v4 para mejor compatibilidad

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3  # Requerido para habilitar características avanzadas de construcción

    - name: Log in to Docker Hub
      uses: docker/login-action@v3  # Actualizado a v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6  # Actualizado a v6 para máxima estabilidad
      with:
        context: .
        push: true
        tags: iotdepartment/eventosapagones:latest
        # Esta opción obliga a GitHub a mostrar el log detallado del compilador .NET
        build-extra-args: --progress=plain
